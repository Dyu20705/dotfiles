# ── 1. Terminal & màu sắc ──────────────────────────────────
set -g default-terminal "xterm-256color"
# Hỗ trợ true color (các terminal hiện đại như wezterm, kitty, alacritty)
set -as terminal-overrides ",*:Tc"

# ── 2. Tổ hợp phím lãnh đạo ─────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── 3. Thiết lập cơ bản ─────────────────────────────────────
set -g mouse on
set-option -g base-index 1
set-option -g renumber-windows on
set-window-option -g mode-keys vi
set -g focus-events on                # Cải thiện tiêu điểm cho wezterm/kitty

# ── 4. Chia pane giữ nguyên thư mục ─────────────────────────
unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# ── 5. Reload cấu hình (không cần prefix) ───────────────────
bind -n C-r source-file ~/.tmux.conf \; display "✔ tmux.conf reloaded"

# ── 6. Resize pane linh hoạt (dùng 2 dòng mỗi lần, giữ phím lặp) ──
bind -r j resize-pane -D 2
bind -r k resize-pane -U 2
bind -r h resize-pane -L 2
bind -r l resize-pane -R 2
bind -r m resize-pane -Z

# ── 7. Copy mode (dùng plugin tmux-yank, chỉ giữ phím kích hoạt) ─
bind -T copy-mode-vi v send -X begin-selection
# Các thao tác copy, paste, mouse sẽ do tmux-yank xử lý tự động

# ── 8. Paste trực tiếp (không prefix) ────────────────────────
bind -n C-v run "tmux set-buffer \"$(wl-paste 2>/dev/null || xclip -o -selection clipboard 2>/dev/null || pbpaste)\" ; tmux paste-buffer"
bind -n S-Insert run "tmux set-buffer \"$(wl-paste 2>/dev/null || xclip -o -selection clipboard 2>/dev/null || pbpaste)\" ; tmux paste-buffer"

# ── 9. Cửa sổ mới & script tuỳ chỉnh ─────────────────────────
bind c new-window -c "#{pane_current_path}"

# Open Neovim in split (portable - no hardcoded user paths)
bind v split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

# Note: Custom bindings (e.g., quick note-taking) should be added to
# ~/.tmux.conf.local (not version controlled) for user-specific paths

# ── 10. Quản lý session ─────────────────────────────────────
# Lưu/khôi phục thủ công (Prefix C-s / Prefix C-r)
bind C-s run "~/.tmux/plugins/tmux-resurrect/scripts/save.sh"
bind C-r run "~/.tmux/plugins/tmux-resurrect/scripts/restore.sh"

# ── 11. Plugin ──────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'         # Cấu hình thông minh có sẵn
set -g @plugin 'christoomey/vim-tmux-navigator'     # Điều hướng Ctrl+hjkl
set -g @plugin 'tmux-plugins/tmux-yank'             # Copy/paste tự động nhận diện OS
set -g @plugin 'tmux-plugins/tmux-resurrect'        # Lưu & khôi phục session
set -g @plugin 'tmux-plugins/tmux-continuum'        # Tự động lưu/restore định kỳ
set -g @plugin 'catppuccin/tmux'                    # Theme đẹp (bản mới nhất)
set -g @plugin 'tmux-plugins/tmux-cpu'              # Hiển thị CPU
set -g @plugin 'xamut/tmux-weather'                 # Hiển thị thời tiết
set -g @plugin 'tmux-plugins/tmux-fzf'              # Tìm kiếm bằng fzf
set -g @plugin 'tmux-plugins/tmux-battery'          # Hiển thị pin (laptop)

# ── 12. Cấu hình Catppuccin Theme ────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
set -g window-status-separator ""

set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text " #[bg=#{@thm_mantle}] #{b:pane_current_path}"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_number_color "#{@thm_lavender}"

# ── 13. Status bar đa nền tảng ───────────────────────────────
set -g status-interval 10                          # Cập nhật nhanh hơn mà vẫn nhẹ
set -g status-right-length 120
set -g status-left "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]#S "
set -g status-style fg=default,bg=default

# Ghép các thành phần status-right một cách độc lập với HĐH
set -g status-right "#(bash ~/dotfiles/tmux/pomodoro.sh) #(bash ~/dotfiles/tmux/random_note.sh) "
set -agF status-right "#{E:@catppuccin_status_weather}"
set -agF status-right "#{E:@catppuccin_status_cpu}"

# Pin (chỉ hiện trên laptop)
set -agF status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰁹 "
set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}]#{battery_status_bg} #{battery_percentage} "

# Bộ nhớ (tự động chọn lệnh theo OS)
set -agF status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰘛 "
if-shell "uname -s | grep -q Darwin" {
    set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(memory_pressure | awk '{print 100 - \$5}')%% "
}
if-shell "uname -s | grep -q Linux" {
    set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] #(free -m | awk 'NR==2{printf \"%.0f\", \$3/\$2*100}')%% "
}

# Ngày giờ
set -agF status-right "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]󰢗 "
set -agF status-right "#[fg=#{@thm_fg},bg=#{@thm_mantle}] %m/%d:%H"

# ── 14. Pomodoro shortcuts ──────────────────────────────────
bind-key b command-prompt -p "Pomodoro (work/break/longbreak)" "run-shell '~/dotfiles/tmux/pomocmd.sh %%'"
bind-key 0 run-shell '~/dotfiles/tmux/pomodoro.sh stop'

# ── 15. Khởi chạy TPM (phải ở cuối file) ────────────────────
run '~/.tmux/plugins/tpm/tpm'

# ── 16. Các tinh chỉnh UI cuối ──────────────────────────────
set -g status-style bg=default
set -g message-style "bg=#{@thm_surface_0},fg=#{@thm_fg}"

# Workflow bindings for editor and clipboard interaction.

bind v split-window -h -c "#{pane_current_path}" "$SHELL -lc 'nvim; exec $SHELL -l'"

bind -T copy-mode-vi v send -X begin-selection

# Prefix+p is the explicit system-clipboard bridge. Ctrl+V and Shift+Insert stay
# available to Neovim, the shell and the terminal's native paste handling.
bind p run-shell -b "#{@tmux_root}/clipboard-paste.sh"

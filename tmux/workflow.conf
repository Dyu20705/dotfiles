# Workflow bindings for editor and clipboard interaction.

bind v split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

bind -T copy-mode-vi v send -X begin-selection

bind -n C-v run-shell -b "#{@tmux_root}/clipboard-paste.sh"
bind -n S-Insert run-shell -b "#{@tmux_root}/clipboard-paste.sh"

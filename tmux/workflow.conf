# Workflow bindings for editor and clipboard interaction.

bind v split-window -h -c "#{pane_current_path}" "$SHELL -lc 'nvim; exec $SHELL -l'"

bind -T copy-mode-vi v send -X begin-selection

# Keep Ctrl+V available to Neovim and other applications.
bind p run-shell -b "#{@tmux_root}/clipboard-paste.sh"
bind -n S-Insert run-shell -b "#{@tmux_root}/clipboard-paste.sh"

# Session lifecycle and reload controls.

bind C-s run-shell -b 'test -x ~/.tmux/plugins/tmux-resurrect/scripts/save.sh && ~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind C-l run-shell -b 'test -x ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh && ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

bind r source-file "#{config_file}" \; display-message "tmux config reloaded"

if-shell "test -f ~/.tmux.conf.local" "source-file ~/.tmux.conf.local"

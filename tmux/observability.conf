# Runtime metadata and low-frequency cache refresh hooks.

set -gq @tmux_config "#{config_file}"
set -gq @feature_nested_helper on
set -gq @feature_clipboard_guard on
set -gq @tmux_sessions_script "#{@tmux_root}/sessions_cache.sh"
set -gq @tmux_status_script "#{@tmux_root}/update_cached_status.sh"

run-shell -b 'tmux set-option -gq @tmux_active_socket "$(tmux display -p "#{socket_name}" 2>/dev/null || true)"'
run-shell -b 'tmux set-option -gq @tmux_session_name "$(tmux display -p "#{session_name}" 2>/dev/null || true)"'
run-shell -b 'tmux set-option -gq @tmux_session_id "$(tmux display -p "#{session_id}" 2>/dev/null || true)"'
run-shell -b 'tmux set-option -gq @tmux_session_windows "$(tmux display -p "#{session_windows}" 2>/dev/null || true)"'

# A nested server inherits the outer TMUX value in its global environment. The
# first server started by WezTerm does not, avoiding the previous false positive.
run-shell -b '
parent_tmux=$(tmux show-environment -g TMUX 2>/dev/null | sed -n "s/^TMUX=//p")
if [ -n "$parent_tmux" ]; then
  tmux set-option -gq @tmux_nested 1
else
  tmux set-option -gq @tmux_nested 0
fi
'

run-shell -b '
cfg=$(tmux display -p "#{config_file}" 2>/dev/null || true)
hash=""
if [ -n "$cfg" ] && [ -r "$cfg" ]; then
  if command -v sha256sum >/dev/null 2>&1; then
    hash=$(sha256sum "$cfg" 2>/dev/null | awk "{print \$1}")
  elif command -v shasum >/dev/null 2>&1; then
    hash=$(shasum -a 256 "$cfg" 2>/dev/null | awk "{print \$1}")
  fi
fi
tmux set-option -gq @tmux_config_hash "$hash"
'

if-shell 'test -n "$SSH_CONNECTION"' \
  'set-option -gq @tmux_ssh 1; if -F "#{==:#{@feature_clipboard_guard},on}" "set-option -g set-clipboard off" ""' \
  'set-option -gq @tmux_ssh 0'

if -F '#{&&:#{==:#{@feature_nested_helper},on},#{==:#{@tmux_nested},1}}' \
  'bind-key P display-message "Forwarding prefix to outer tmux" \; send-prefix'

run-shell -b '"#{@tmux_sessions_script}" >/dev/null 2>&1 || true'
run-shell -b '"#{@tmux_status_script}" >/dev/null 2>&1 || true'

set-hook -g session-created 'run-shell -b "#{@tmux_sessions_script}"'
set-hook -g session-closed 'run-shell -b "#{@tmux_sessions_script}"'
set-hook -g session-renamed 'run-shell -b "#{@tmux_sessions_script}"'
set-hook -g client-session-changed 'run-shell -b "#{@tmux_sessions_script}"'
set-hook -g client-attached 'run-shell -b "#{@tmux_sessions_script}"; run-shell -b "#{@tmux_status_script}"'

bind-key D display-message "socket=#{@tmux_active_socket} config=#{@tmux_config} hash=#{@tmux_config_hash} nested=#{@tmux_nested} ssh=#{@tmux_ssh} session=#{@tmux_session_name} windows=#{@tmux_session_windows}"

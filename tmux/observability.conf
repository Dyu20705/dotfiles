# Observability and runtime metadata.
# Minimal, tmux-native values set at config load time. Avoids polling.

# Store config path (explicit)
set -gq @tmux_config "#{config_file}"
set -gq @tmux_root "#{@tmux_root}"

# Feature flags (can be toggled for incremental rollout)
set -gq @feature_nested_helper on
set -gq @feature_clipboard_guard on

# Active socket and session metadata — populate via background shells at load-time
run-shell -b 'tmux set-option -gq @tmux_active_socket "$(tmux display -p "#{socket_name}" 2>/dev/null || true)" 2>/dev/null || true'
run-shell -b 'tmux set-option -gq @tmux_session_name "$(tmux display -p "#{session_name}" 2>/dev/null || true)" 2>/dev/null || true'
run-shell -b 'tmux set-option -gq @tmux_session_id "$(tmux display -p "#{session_id}" 2>/dev/null || true)" 2>/dev/null || true'
run-shell -b 'tmux set-option -gq @tmux_session_windows "$(tmux display -p "#{session_windows}" 2>/dev/null || true)" 2>/dev/null || true'

# Nested detection: compute a nesting depth using $TMUX (cheap, load-time only)
run-shell -b 'if [ -n "$TMUX" ]; then depth=$(echo "$TMUX" | awk -F"," "{print NF}"); tmux set-option -gq @tmux_nested 1; tmux set-option -gq @tmux_nested_level "$depth"; else tmux set-option -gq @tmux_nested 0; tmux set-option -gq @tmux_nested_level 0; fi'

# Client metadata when available (best-effort, non-blocking)
run-shell -b 'pid=$(tmux display -p "#{client_pid}" 2>/dev/null || true); [ -n "$pid" ] && tmux set-option -gq @tmux_client_pid "$pid" 2>/dev/null || true'
run-shell -b 'tty=$(tmux display -p "#{client_tty}" 2>/dev/null || true); [ -n "$tty" ] && tmux set-option -gq @tmux_client_tty "$tty" 2>/dev/null || true'

# Config checksum (best-effort, prefer sha256sum then shasum)
run-shell -b '
	cfg=$(tmux display -p "#{config_file}" 2>/dev/null || true)
	if [ -n "$cfg" ]; then
		if command -v sha256sum >/dev/null 2>&1; then
			h=$(sha256sum "$cfg" 2>/dev/null | awk "{print \$1}")
		elif command -v shasum >/dev/null 2>&1; then
			h=$(shasum -a 256 "$cfg" 2>/dev/null | awk "{print \$1}")
		fi
		[ -n "$h" ] && tmux set-option -gq @tmux_config_hash "$h" 2>/dev/null || true
	fi
'

# SSH-aware clipboard behavior: when inside SSH, prefer not to rely on local clipboard
if-shell 'test -n "$SSH_CONNECTION"' 'set -gq @tmux_ssh 1; if -F "#{@feature_clipboard_guard}" "on" "set-option -gq set-clipboard off" ""' 'set -gq @tmux_ssh 0'

# Provide a small helper binding when nested: forward the prefix to outer tmux.
# Bound only when feature flag is on and nesting detected.
if-shell 'test -n "$TMUX" -a "#{@feature_nested_helper}" = "on"' "bind-key P display-message 'Forwarding prefix to outer tmux' \; send-prefix" ''

# Update session list cache (used by status-left). Run in background and on hooks.
run-shell -b '"${HOME:-$HOME}/dotfiles/tmux/sessions_cache.sh" >/dev/null 2>&1 || true'

# Hooks to refresh session cache when sessions change or clients attach

# Hooks to refresh session cache when sessions change or clients attach/rename
set-hook -g session-created  'run-shell "${HOME}/dotfiles/tmux/sessions_cache.sh"'
set-hook -g session-closed   'run-shell "${HOME}/dotfiles/tmux/sessions_cache.sh"'
set-hook -g session-renamed  'run-shell "${HOME}/dotfiles/tmux/sessions_cache.sh"'
set-hook -g client-attached  'run-shell "${HOME}/dotfiles/tmux/sessions_cache.sh"; run-shell "${HOME}/dotfiles/tmux/update_cached_status.sh"'
set-hook -g client-session-changed 'run-shell "${HOME}/dotfiles/tmux/sessions_cache.sh"'

# Load cached status (tmux_status) into tmux option on startup
run-shell -b '"${HOME}/dotfiles/tmux/update_cached_status.sh" >/dev/null 2>&1 || true'
# Diagnostic display (cheap, on demand): shows a single-line summary including config hash
bind-key D display-message "socket=#{@tmux_active_socket} config=#{@tmux_config} hash=#{@tmux_config_hash} nested=#{@tmux_nested} level=#{@tmux_nested_level} ssh=#{@tmux_ssh} session=#{@tmux_session_name} windows=#{@tmux_session_windows}"

# Lightweight hook: on-client-attached show an unobtrusive message once when nested
if-shell 'test -n "$TMUX"' 'set-hook -g client-attached "display-message \"Nested tmux: press Prefix+P to forward prefix\""' ''

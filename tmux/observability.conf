# Observability and runtime metadata.
# Minimal, tmux-native values set at config load time. Avoids polling.

# Store config path (already set by top-level run-shell, but keep explicit)
set -gq @tmux_config "#{config_file}"
set -gq @tmux_root "#{@tmux_root}"

# Active socket and session metadata — populate via a background shell at load-time
run-shell -b 'tmux set-option -gq @tmux_active_socket "$(tmux display -p \"#{socket_name}\")" 2>/dev/null || true'
run-shell -b 'tmux set-option -gq @tmux_session_name "$(tmux display -p \"#{session_name}\")" 2>/dev/null || true'
run-shell -b 'tmux set-option -gq @tmux_session_id "$(tmux display -p \"#{session_id}\")" 2>/dev/null || true'
run-shell -b 'tmux set-option -gq @tmux_session_windows "$(tmux display -p \"#{session_windows}\")" 2>/dev/null || true'

# Nested detection (simple, avoids heavy shelling). If $TMUX is set then we are nested.
if-shell 'test -n "$TMUX"' 'set -gq @tmux_nested 1' 'set -gq @tmux_nested 0'

# Provide a small helper binding when nested: forward the prefix to outer tmux.
# This is a conservative helper and does not change core prefix behavior.
if-shell 'test -n "$TMUX"' "bind P run-shell -b 'tmux display-message -p \"Forwarding prefix to outer session\"; tmux send-prefix'" ''

# SSH-aware clipboard behavior: when inside SSH, prefer not to rely on local clipboard
if-shell 'test -n "$SSH_CONNECTION"' 'set -gq @tmux_ssh 1; set-option -gq set-clipboard off' 'set -gq @tmux_ssh 0'

# Expose a single diagnostic show command that prints metadata (cheap, on demand)
bind-key D run-shell -b 'tmux display-message "socket=#{@tmux_active_socket} config=#{@tmux_config} nested=#{@tmux_nested} ssh=#{@tmux_ssh} session=#{@tmux_session_name} windows=#{@tmux_session_windows}"'

# Lightweight hook: on-client-attached show an unobtrusive message once when nested
if-shell 'test -n "$TMUX"' 'set-hook -g client-attached "run-shell -b \"tmux display-message \"Nested tmux: press Prefix+P to forward prefix\"\""' ''

# Core terminal, navigation, and session behavior.

set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g focus-events on
set -g set-clipboard on

unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
bind \\ split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

bind c new-window -c "#{pane_current_path}"

bind -r h resize-pane -L 2
bind -r j resize-pane -D 2
bind -r k resize-pane -U 2
bind -r l resize-pane -R 2
bind -r m resize-pane -Z

set -g escape-time 0
set -g history-limit 50000
set -g detach-on-destroy off
set -g update-environment "DISPLAY SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION SSH_CLIENT SSH_TTY WAYLAND_DISPLAY XAUTHORITY"

# Quick session switch: prefix + number -> switch to session with matching session_index
bind 1 run-shell -b "${HOME}/dotfiles/tmux/switch_session.sh 1"
bind 2 run-shell -b "${HOME}/dotfiles/tmux/switch_session.sh 2"
bind 3 run-shell -b "${HOME}/dotfiles/tmux/switch_session.sh 3"
bind 4 run-shell -b "${HOME}/dotfiles/tmux/switch_session.sh 4"
bind 5 run-shell -b "${HOME}/dotfiles/tmux/switch_session.sh 5"
bind 6 run-shell -b "${HOME}/dotfiles/tmux/switch_session.sh 6"
bind 7 run-shell -b "${HOME}/dotfiles/tmux/switch_session.sh 7"
bind 8 run-shell -b "${HOME}/dotfiles/tmux/switch_session.sh 8"
bind 9 run-shell -b "${HOME}/dotfiles/tmux/switch_session.sh 9"

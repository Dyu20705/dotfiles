# Essential plugin set only.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Preserve Prefix+C-l for the explicit tmux-resurrect restore binding.
set -g @vim_navigator_prefix_mapping_clear_screen ""

if-shell 'test -x "$HOME/.tmux/plugins/tpm/tpm"' \
  'run-shell "$HOME/.tmux/plugins/tpm/tpm"' \
  'display-message "TPM not installed; core tmux configuration is active"'

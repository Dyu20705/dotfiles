# Status bar and pane/window observability.

set -g status-interval 30
set -g status-right-length 160
set -g status-left-length 90

set -g status-style fg=default,bg=default
set -g message-style "bg=#1e1e2e,fg=#cdd6f4"

set -g status-left "#[bg=#a6e3a1,fg=#1e1e2e] #{session_name} #[bg=default,fg=default]#[fg=#a6e3a1]#{?client_prefix, PREFIX,} #[fg=#6c7086]#{host_short}"
set -g status-right "#[fg=#a6adc8]#{b:pane_current_path} #[fg=#cdd6f4]#{session_windows}w #[fg=#a6adc8]%H:%M"

set -g window-status-separator " "
set -g window-status-format "#[fg=#6c7086]#I:#W"
set -g window-status-current-format "#[bg=#f38ba8,fg=#1e1e2e]#I:#W#[bg=default,fg=default]"

setw -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#f38ba8
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format "#[fg=#a6adc8]#{pane_index} #[fg=#cdd6f4]#{pane_current_command} #[fg=#a6adc8]#{b:pane_current_path}"

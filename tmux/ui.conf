# Status bar and pane/window observability.

set -g status-interval 30
set -g status-right-length 160
set -g status-left-length 90

set -g status-style fg=default,bg=default
set -g message-style "bg=#1e1e2e,fg=#cdd6f4"

"# Status-left: session navigator — show cached session list (indices + names)."
# sessions_cache.sh populates @tmux_sessions with a compact formatted list like: [1:dev] [2:notes]
set -g status-left "#{@tmux_sessions}" 

# Status-right: compact cached metrics (weather, todo, cpu, battery). Populated by build_status_cache.sh
# and copied into @tmux_cached_status via update_cached_status.sh (run by systemd/cron or client-attached hook).
set -g status-right "#{?client_prefix, PREFIX,} #{@tmux_cached_status}"

set -g window-status-separator " "
set -g window-status-format "#[fg=#6c7086]#I:#W"
set -g window-status-current-format "#[bg=#f38ba8,fg=#1e1e2e]#I:#W#[bg=default,fg=default]"

setw -g allow-rename off
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_path}"

set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#f38ba8
set -g pane-border-lines single
set -g pane-border-status top
set -g pane-border-format "#[fg=#a6adc8]#{pane_index} #[fg=#cdd6f4]#{pane_current_command} #[fg=#a6adc8]#{b:pane_current_path}"

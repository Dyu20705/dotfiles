# Canonical tmux entrypoint.
# Resolve the file currently being parsed when supported. If ~/.tmux.conf is a
# copied file rather than a symlink, fall back to the documented dotfiles root.
run-shell '
config_path="#{current_file}"
[ -n "$config_path" ] || config_path="#{config_file}"

if [ -n "$config_path" ]; then
  if command -v realpath >/dev/null 2>&1; then
    config_path="$(realpath "$config_path")"
  elif command -v python3 >/dev/null 2>&1; then
    config_path="$(python3 -c "import os,sys; print(os.path.realpath(sys.argv[1]))" "$config_path")"
  fi
  config_dir="$(dirname "$config_path")"
else
  config_dir=""
fi

if [ ! -f "$config_dir/base.conf" ]; then
  checkout_root="${DOTFILES_ROOT:-$HOME/dotfiles}"
  case "$checkout_root" in
    */tmux) candidate_dir="$checkout_root" ;;
    *) candidate_dir="$checkout_root/tmux" ;;
  esac

  if command -v realpath >/dev/null 2>&1; then
    candidate_dir="$(realpath "$candidate_dir" 2>/dev/null || printf "%s" "$candidate_dir")"
  elif command -v python3 >/dev/null 2>&1; then
    candidate_dir="$(python3 -c "import os,sys; print(os.path.realpath(sys.argv[1]))" "$candidate_dir")"
  fi

  if [ -f "$candidate_dir/base.conf" ]; then
    config_dir="$candidate_dir"
  else
    printf "tmux: unable to locate modular config (checked %s and %s)\n" \
      "${config_dir:-<unknown>}" "$candidate_dir" >&2
    exit 1
  fi
fi

tmux set-option -gq @tmux_root "$config_dir"
tmux source-file "$config_dir/base.conf"
tmux source-file "$config_dir/workflow.conf"
tmux source-file "$config_dir/session.conf"
tmux source-file "$config_dir/ui.conf"
tmux source-file "$config_dir/plugins.conf"
tmux source-file "$config_dir/observability.conf"
'

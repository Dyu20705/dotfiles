# Canonical tmux entrypoint.
# `current_file` identifies this config and `source-file -F` expands formats.
# Keeping the entire load inside the current server avoids reconnecting to the
# default socket from an isolated test or nested tmux server.

set-option -gqF @tmux_root "#{d:current_file}"
source-file -F "#{@tmux_root}/base.conf"
source-file -F "#{@tmux_root}/workflow.conf"
source-file -F "#{@tmux_root}/session.conf"
source-file -F "#{@tmux_root}/ui.conf"
source-file -F "#{@tmux_root}/plugins.conf"
source-file -F "#{@tmux_root}/observability.conf"

# Canonical tmux entrypoint.
# Resolve the checkout path once, then load every layer synchronously so the
# first created session sees the complete configuration.

run-shell '
config_path="#{config_file}"
if command -v realpath >/dev/null 2>&1; then
  config_path="$(realpath "$config_path")"
elif command -v python3 >/dev/null 2>&1; then
  config_path="$(python3 -c "import os,sys; print(os.path.realpath(sys.argv[1]))" "$config_path")"
fi
config_dir="$(dirname "$config_path")"
tmux set-option -gq @tmux_root "$config_dir"
tmux source-file "$config_dir/base.conf"
tmux source-file "$config_dir/workflow.conf"
tmux source-file "$config_dir/session.conf"
tmux source-file "$config_dir/ui.conf"
tmux source-file "$config_dir/plugins.conf"
tmux source-file "$config_dir/observability.conf"
'

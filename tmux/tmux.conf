# Terminal compatibility (Kitty outside tmux, tmux-256color inside).
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB:clipboard"

# General behavior.
set -g mouse on
set -g history-limit 10000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g set-clipboard external
set -g mode-keys vi

# Use Ctrl-a as the prefix.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits inherit the current working directory.
unbind %
bind | split-window -h -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Move between panes with the prefix followed by h/j/k/l.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Vi-style copy mode; tmux sends copied text to Kitty via OSC 52.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Reload configuration.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Minimal status line.
set -g status-position bottom
set -g status-interval 60
set -g status-left-length 30
set -g status-right-length 40
set -g status-left "[ #S ] "
set -g status-right "%Y-%m-%d %H:%M"

# Canonical tmux entrypoint.
# Resolve the physical file path before loading modular configuration. This keeps
# direct, symlinked and copied ~/.tmux.conf entrypoints deterministic.
run-shell '
resolve_path() {
  path=$1
  links=0

  while [ -L "$path" ]; do
    [ "$links" -lt 40 ] || return 1
    target=$(readlink "$path") || return 1
    case "$target" in
      /*) path=$target ;;
      *) path="$(dirname "$path")/$target" ;;
    esac
    links=$((links + 1))
  done

  directory=$(cd -P "$(dirname "$path")" 2>/dev/null && pwd) || return 1
  printf "%s/%s\n" "$directory" "$(basename "$path")"
}

config_path="#{current_file}"
[ -n "$config_path" ] || config_path="#{config_file}"
resolved_path=$(resolve_path "$config_path" 2>/dev/null || true)
[ -n "$resolved_path" ] && config_path=$resolved_path
config_dir=$(dirname "$config_path")

if [ ! -f "$config_dir/base.conf" ]; then
  checkout_root=${DOTFILES_ROOT:-$HOME/dotfiles}
  case "$checkout_root" in
    */tmux) candidate_dir=$checkout_root ;;
    *) candidate_dir=$checkout_root/tmux ;;
  esac

  resolved_dir=$(cd -P "$candidate_dir" 2>/dev/null && pwd || true)
  [ -n "$resolved_dir" ] && candidate_dir=$resolved_dir

  if [ -f "$candidate_dir/base.conf" ]; then
    config_dir=$candidate_dir
  else
    printf "tmux: unable to locate modular config (checked %s and %s)\n" \
      "${config_dir:-<unknown>}" "$candidate_dir" >&2
    exit 1
  fi
fi

tmux set-option -gq @tmux_config "$config_path"
tmux set-option -gq @tmux_root "$config_dir"
'

source-file -F "#{@tmux_root}/base.conf"
source-file -F "#{@tmux_root}/workflow.conf"
source-file -F "#{@tmux_root}/session.conf"
source-file -F "#{@tmux_root}/ui.conf"
source-file -F "#{@tmux_root}/plugins.conf"
source-file -F "#{@tmux_root}/observability.conf"

# Machine-local overrides must win over every canonical layer.
if-shell 'test -f "$HOME/.tmux.conf.local"' 'source-file "$HOME/.tmux.conf.local"'

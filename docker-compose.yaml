services:
  lazydocker:
    # The upstream Docker Hub repository currently exposes `latest` and legacy
    # version tags, not tags matching current GitHub releases. Keep this choice
    # explicit and prefer the native LazyDocker binary for the newest release.
    image: lazyteam/lazydocker:${LAZYDOCKER_IMAGE_TAG:-latest}
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
    volumes:
      # Security note: access to the Docker socket is effectively host-level
      # Docker control. Run only trusted images and inspect updates before use.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.config/jesseduffield/lazydocker:/.config/jesseduffield/lazydocker

services:
  lazydocker:
    image: lazyteam/lazydocker:latest
    container_name: lazydocker
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.config/jesseduffield/lazydocker:/.config/jesseduffield/lazydocker

name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global markdownlint-cli2
      - run: markdownlint-cli2 README.md "docs/**/*.md"

  static:
    name: Static configuration checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq zsh shellcheck lua5.4 yamllint tmux
      - name: Run static checks
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test.sh --profile static 2>&1 | tee "$RUNNER_TEMP/static.log"
      - name: Run editor contract checks
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-nvim-contract.sh 2>&1 | tee -a "$RUNNER_TEMP/static.log"
      - name: Upload static validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-validation-log
          path: ${{ runner.temp }}/static.log
          if-no-files-found: warn
          retention-days: 7

  runtime:
    name: Runtime smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          show-progress: false
      - name: Install runtime tools on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq zsh tmux neovim
      - name: Install runtime tools on macOS
        if: runner.os == 'macOS'
        run: brew install jq tmux neovim >/dev/null
      - name: Run runtime smoke tests
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test.sh --profile runtime 2>&1 | tee "$RUNNER_TEMP/runtime-${RUNNER_OS}.log"
      - name: Upload runtime validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-validation-${{ runner.os }}
          path: ${{ runner.temp }}/runtime-${RUNNER_OS}.log
          if-no-files-found: warn
          retention-days: 7

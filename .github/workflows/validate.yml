name: validate

on:
  push:
  pull_request:

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --global markdownlint-cli2
      - run: markdownlint-cli2 README.md "docs/**/*.md"

  shell-yaml:
    name: Shell and YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y shellcheck tmux
      - run: python3 -m pip install --user yamllint
      - name: Bash syntax
        run: |
          find bash git tmux -type f -name '*.sh' -print0 | xargs -0 -r bash -n
      - name: ShellCheck
        run: |
          find bash git tmux -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
      - name: Tmux tests
        run: |
          set -o pipefail
          {
            bash tmux/tests/load_plugins_test.sh
            bash tmux/tests/config_entrypoint_test.sh
          } 2>&1 | tee tmux-test.log
      - name: Upload tmux test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmux-test-diagnostics
          path: tmux-test.log
      - name: YAML lint
        run: |
          ~/.local/bin/yamllint -d relaxed docker-compose.yaml lazygit/config.yml .github/workflows/validate.yml

  lua:
    name: Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y lua5.4 luarocks
      - run: sudo luarocks install luacheck
      - name: Lua syntax
        run: |
          find nvim/.config/nvim/lua wezterm -type f -name '*.lua' -print0 | while IFS= read -r -d '' file; do
            luac5.4 -p "$file"
          done
      - name: Luacheck
        run: |
          luacheck nvim/.config/nvim/lua wezterm/.wezterm.lua

name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --global markdownlint-cli2
      - run: markdownlint-cli2 README.md "docs/**/*.md"

  static:
    name: Static configuration checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zsh shellcheck lua5.4 yamllint tmux docker-compose-v2
      - name: Run static checks
        run: bash scripts/test.sh --profile static

  runtime:
    name: Runtime smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime tools on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zsh tmux neovim
      - name: Install runtime tools on macOS
        if: runner.os == 'macOS'
        run: brew install jq tmux neovim
      - name: Run runtime smoke tests
        run: bash scripts/test.sh --profile runtime

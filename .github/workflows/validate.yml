name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: npm install --global markdownlint-cli2
      - shell: bash
        run: |
          set -o pipefail
          markdownlint-cli2 \
            README.md \
            CONTRIBUTING.md \
            "docs/**/*.md" \
            2>&1 | tee "$RUNNER_TEMP/markdown.log"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdown-validation-log
          path: ${{ runner.temp }}/markdown.log
          if-no-files-found: warn
          retention-days: 7

  static:
    name: Static configuration checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 2
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            jq zsh shellcheck lua5.4 yamllint tmux
      - name: Run editor contract checks
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-nvim-contract.sh \
            2>&1 | tee "$RUNNER_TEMP/static.log"
      - name: Run tmux integration contract checks
        shell: bash
        run: |
          set -o pipefail
          bash scripts/check-tmux-contract.sh \
            2>&1 | tee -a "$RUNNER_TEMP/static.log"
      - name: Run static checks
        shell: bash
        env:
          WAYLAND_DISPLAY: wayland-0
        run: |
          set -o pipefail
          bash scripts/test.sh --profile static \
            2>&1 | tee -a "$RUNNER_TEMP/static.log"
      - name: Run repository contract checks
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test-contracts.sh \
            2>&1 | tee -a "$RUNNER_TEMP/static.log"
      - name: Upload static validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-validation-log
          path: ${{ runner.temp }}/static.log
          if-no-files-found: warn
          retention-days: 7

  runtime:
    name: Runtime smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
      - name: Install runtime tools on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq zsh tmux neovim
      - name: Install runtime tools on macOS
        if: runner.os == 'macOS'
        run: brew install jq tmux neovim >/dev/null
      - name: Run runtime smoke tests
        shell: bash
        run: |
          set -o pipefail
          bash scripts/test.sh --profile runtime \
            2>&1 | tee "$RUNNER_TEMP/runtime-${RUNNER_OS}.log"
      - name: Upload runtime validation log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-validation-${{ runner.os }}
          path: ${{ runner.temp }}/runtime-${RUNNER_OS}.log
          if-no-files-found: warn
          retention-days: 7
